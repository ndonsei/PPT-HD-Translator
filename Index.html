function classify(v){let s=String(v??'').trim().toLowerCase();if(/^(good|ok|ready|healthy|normal|online|up|active|optimal|passed)$/.test(s))return 'good';if(/warning|degraded|caution|unknown/.test(s))return 'warn';if(/critical|failed|failure|error|down|offline|fault|bad/.test(s))return 'bad';return ''}
function fieldRow(table,label,value){const tr=el('tr');tr.append(el('td',label));let td=el('td',value===undefined||value===null||value===''?'—':value);if(/^(alert|severity)$/i.test(label))td.className=classify(value);tr.append(td);table.append(tr)}
function section(parent,title){parent.append(el('div',title,'section-title'))}
function makeSummary(parent,items){let t=el('table',undefined,'summary-table');for(const [a,b] of items)fieldRow(t,a,b);parent.append(t)}
function groupTable(parent,group){if(!group||typeof group!=='object')return;let entries=Object.entries(group).filter(([,v])=>v&&typeof v==='object'&&Array.isArray(v.values));if(!entries.length)return;let count=Math.max(...entries.map(([,v])=>v.values.length));let t=el('table',undefined,'data-table'),head=el('tr');let indexEntries=entries.filter(([,v])=>v.is_index),otherEntries=entries.filter(([,v])=>!v.is_index);let cols=[...indexEntries,...otherEntries];if(!indexEntries.length){head.append(el('th','#'))}for(let [key,v] of cols)head.append(el('th',v.label||key.replace(/_/g,' ')));t.append(head);for(let i=0;i<count;i++){let tr=el('tr');if(!indexEntries.length)tr.append(el('td',i));for(let [key,v] of cols){let val=v.values[i]??'—',td=el('td',val);if(/status|health|smart/i.test(key+' '+(v.label||'')))td.className=classify(val);tr.append(td)}t.append(tr)}parent.append(t)}
function prettyTitle(s){return String(s).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace(/^Hd$/,'HD').replace(/^Raid$/,'RAID')}
function extract(raw){let start=raw.indexOf('{');if(start<0)throw Error('No JSON object found. Paste a JSON object containing properties and snmpData.');let prefix=raw.slice(0,start).trim();let data=JSON.parse(raw.slice(start));if(!data||typeof data!=='object'||Array.isArray(data))throw Error('The JSON root must be an object.');let url=prefix.match(/https?:\/\/[^\s]+/);return {data,url:url?url[0]:''}}
function render(){let input=$('jsonInput').value.trim();$('error').textContent='';if(!input){$('error').textContent='Paste JSON first.';return}try{let {data,url}=extract(input),p=data.properties||{},snmp=data.snmpData||{},r=$('report');r.replaceChildren();let rh=el('div',undefined,'report-header'),name=el('strong',p.hostname||'Device Report'),sev=el('span',p.severity||'UNKNOWN','pill '+classify(p.severity));rh.append(name,sev);r.append(rh);if(url){let link=el('a','View original incident');link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.style.fontSize='12px';r.append(link)}section(r,'Summary');makeSummary(r,[['Alert',p.alert],['Model',p.model],['Serial',p.serial_number],['Product',p.product_id],['Severity',p.severity]]);section(r,'System Info');makeSummary(r,[['Hostname',p.hostname],['IP Address',p.ip_address],...(p.os?[['OS',p.os]]:[]),...(p.overall_health?[['Overall Health',p.overall_health]]:[])]);let ordering=['fan','hd','raid','system_information'];for(let key of [...ordering.filter(k=>snmp[k]),...Object.keys(snmp).filter(k=>!ordering.includes(k))]){section(r,({fan:'Fan',hd:'HD',raid:'RAID',system_information:'System Information'})[key]||prettyTitle(key));groupTable(r,snmp[key])}currentReport={data,url};}catch(e){$('error').textContent='Invalid input: '+e.message}}
$('jsonInput').addEventListener('input',render);$('jsonInput').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')render()});$('clearBtn').onclick=()=>{$('jsonInput').value='';$('error').textContent='';$('report').innerHTML='<div class="placeholder">Your formatted QNAP report will appear here.</div>';currentReport=null};$('copyBtn').onclick=async()=>{let r=$('report');if(!currentReport)return;try{await navigator.clipboard.writeText(r.innerText);$('copyBtn').textContent='Copied!';setTimeout(()=>$('copyBtn').textContent='Copy Report',1400)}catch(e){$('error').textContent='Clipboard unavailable. Select the report text and copy manually.'}};$('printBtn').onclick=()=>{if(currentReport)window.print()};
const example={format:'expanded',properties:{alert:'Interface link down: 1045504387 .1.3.6.1.6.3.1.1.5.3',description:'',hostname:'STNAS018984',ip_address:'10.207.124.244',model:'Q217I07609G',product_id:'',serial_number:'Q217I07609G',severity:'WARNING'},snmpData:{fan:{fan:{is_index:true,label:'HD',values:['System FAN 1','System FAN 2']},fan_speed:{label:'Fan Speed',values:['6150 RPM','6150 RPM']},fan_status:{label:'Fan Status',values:['ok','ok']}},hd:{hd_desc:{is_index:true,label:'HD',values:['HDD1','HDD2','HDD3','HDD4']},hd_serial:{label:'HD Model Number',values:Array(4).fill('ST16000NM001G-2KK103')},hd_smart_status:{label:'HD Smart Status',values:['GOOD','GOOD','GOOD','Warning']},hd_status:{label:'HD Status',values:Array(4).fill('ready')},hd_temp:{label:'HD Temp',values:['34 C/93 F','36 C/96 F','36 C/96 F','37 C/98 F']}},raid:{status:{label:'Raid Status',values:['Ready']}},system_information:{description:{label:'Description',values:['QNAP Turbo NAS TS-432PXU']},hostname:{label:'Hostname',values:['STNAS018984']},model:{label:'Model',values:['Q217I07609G']},serial:{label:'Serial Number',values:['Q217I07609G']}}}};
</script></body></html>
